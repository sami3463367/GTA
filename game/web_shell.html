<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101f2e"><link rel="icon" href="index.icon.png"><title>Azure Harbor • Native Godot Preview</title>$GODOT_HEAD_INCLUDE<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101f2e;color:#dce9dd;font-family:system-ui,sans-serif;touch-action:none}#canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;background:radial-gradient(ellipse at 55% 30%,#234955,#101c2c 70%);text-align:center}#loading[hidden]{display:none}.eyebrow{font-size:11px;letter-spacing:4px;color:#b4d3bd}h1{font-size:42px;letter-spacing:-2px;margin:15px 0}p{font-size:13px;color:#99b8bd;max-width:390px;line-height:1.6}.rail{height:3px;border-radius:8px;overflow:hidden;background:#ffffff18;margin:24px 0}.fill{height:100%;background:linear-gradient(90deg,#65b8c1,#e0eab4);width:0%;transition:width .2s}</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="Azure Harbor Godot game"></canvas>
<section id="loading"><div class="eyebrow">ONE CITY. MANY STORIES.</div><h1>AZURE HARBOR</h1><p id="status">Loading the same Godot game used by the native Android app. The first load includes the game engine and bundled art.</p><div class="rail"><div id="fill" class="fill"></div></div><p>Keyboard: WASD move · E talk · F vehicle · R reload<br>Touch: joystick and action icons · Best in landscape</p></section>
<script src="$GODOT_URL"></script><script>
const engine = new Engine($GODOT_CONFIG);
window.addEventListener('contextmenu', event => event.preventDefault());
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(total)document.getElementById('fill').style.width=(current/total*100)+'%';}}).then(()=>{document.getElementById('loading').hidden=true;document.body.dataset.gameReady='true';document.getElementById('canvas').focus();}).catch(error=>{document.getElementById('status').textContent='The game could not start: '+error.message+'. Try a current browser with WebGL 2 enabled.';document.body.dataset.gameError='true';console.error(error);});
</script></body></html>
